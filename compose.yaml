services:
  api:
    image: air-quality-api:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      PORT: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-5251}:8080"
    init: true
    restart: unless-stopped
